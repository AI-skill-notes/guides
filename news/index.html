<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI스킬노트 Claude 소식</title>
<meta name="description" content="Claude와 Claude Code에 생긴 일을 공식 원문으로 확인해 쉬운 말로 정리한 소식">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* same house as the guide hub (scripts/guide_hub_template.html): calm claude.com-like field, flat, no pills/shadows/gradients.
   Idea: a wire-desk ledger - the day is the big mark in the left column, the stories run down the right. */
:root{
  --sky:#F0EEE6; --ink:#141413; --paper:#FAF9F5; --fog:#E8E6DC; --coral:#D97757; --mute:#5E5D59;
  --side:clamp(16px,4vw,56px);
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.7 "IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.frame{padding:0 var(--side);max-width:1180px;margin:0 auto}

.top{background:var(--sky)}
.top .frame{padding-top:52px;padding-bottom:40px}
.back{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-size:16px}
h1{font:400 clamp(48px,7vw,96px)/1 "Black Han Sans",sans-serif;margin:22px 0 18px;letter-spacing:-.015em;word-break:keep-all}
.lede{max-width:600px;margin:0 0 22px;font-size:18px}
.orgs{display:flex;flex-wrap:wrap;gap:6px 18px}
.orgs button{border:0;background:none;padding:2px 0;font:700 17px "IBM Plex Sans KR";color:var(--mute);cursor:pointer;
  text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:transparent}
.orgs button[aria-pressed="true"]{color:var(--ink);text-decoration-color:var(--coral)}
.orgs button:hover{color:var(--ink)}

.day{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(16px,4vw,56px);padding:40px 0;border-top:1px solid var(--fog)}
.day:first-child{border-top:0}
.when{position:sticky;top:20px;align-self:start}
.when b{display:block;font:400 clamp(44px,5vw,64px)/1 "Black Han Sans",sans-serif}
.when span{color:var(--mute);font-weight:500}
.story{padding:0 0 30px}
.story:last-child{padding-bottom:0}
.org{font-weight:700;color:var(--coral);font-size:15px}
.story h2{font:700 clamp(21px,2vw,25px)/1.4 "IBM Plex Sans KR";margin:2px 0 6px;word-break:keep-all}
.story p{margin:0 0 10px;max-width:680px;word-break:keep-all}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.src{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-size:15px}
.vid{display:inline-block;text-decoration:none;font:700 15px "IBM Plex Sans KR";padding:8px 14px;border-radius:4px;background:var(--ink);color:var(--paper)}
.vid:hover{background:#3D3D3A}
.empty{padding:48px 0;font-size:18px}
footer .frame{padding-top:28px;padding-bottom:40px;color:var(--mute);font-size:15px;border-top:1px solid var(--fog)}

@media (max-width:720px){
  .day{grid-template-columns:minmax(0,1fr);gap:10px;padding:30px 0}
  .when{position:static}
  .when b{display:inline;font-size:38px;margin-right:10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="frame">
    <a class="back" href="../">← 무료 자료실</a>
    <h1>Claude 소식</h1>
    <p class="lede">Claude와 Claude Code에 생긴 일만 골라 공식 원문을 읽고 쉬운 말로 줄였어요. 모든 소식에 원문 링크가 있어요.</p>
    <div class="orgs" id="orgs" role="group" aria-label="분야별로 보기"></div>
  </div>
</header>
<main class="frame" id="list" aria-live="polite"></main>
<footer><div class="frame">Claude에 새 소식이 있는 날 아침에 더해져요 · 마지막 정리 2026-11-03 17:31 · <a href="https://www.youtube.com/@ai스킬노트">유튜브 AI스킬노트</a></div></footer>
<script>
const DATA = [{"date": "2026-11-02", "org": "Claude API", "title": "클로드 API '메시지 스레드' 공개 베타: 새 메시지만 보내면 된다", "summary": "긴 대화에서 매번 전체 기록을 다시 보내지 않고 새 메시지만 보내는 기능이에요. 50만~100만 토큰 요청에서 첫 응답까지 시간이 중앙값 약 35% 줄었고, 토큰 사용량은 그대로예요. 스레드는 마지막 요청 5분 뒤 사라져요.", "url": "https://claude.com/resources/articles/message-threads", "video": null}, {"date": "2026-11-02", "org": "Anthropic 회사", "title": "앤트로픽 상장 신고서 수정본 제출: 3분기 매출 170억 달러", "summary": "미국 증권거래위원회에 낸 상장 신고서 수정본(S-1/A)에 9월 30일로 끝난 3개월 매출이 170억 달러, 1년 전보다 1,127% 늘었다고 적혀 있어요.", "url": "https://www.sec.gov/Archives/edgar/data/2130357/000162828026068676/anthropicpbc-sx1ax1.htm", "video": null}];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD = ["일","월","화","수","목","금","토"];
let pick = "전체";
const orgs = ["전체", ...[...new Set(DATA.map(d => d.org))]];
const ob = document.getElementById("orgs");
ob.innerHTML = orgs.map(o => `<button type="button" aria-pressed="${o === pick}">${esc(o)}</button>`).join("");
ob.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  pick = b.textContent;
  ob.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  draw();
});
function draw() {
  const rows = DATA.filter(d => pick === "전체" || d.org === pick);
  const days = {};
  rows.forEach(d => (days[d.date] ||= []).push(d));
  const el = document.getElementById("list");
  if (!rows.length) { el.innerHTML = `<p class="empty">아직 정리한 소식이 없어요. 내일 아침에 다시 와 주세요.</p>`; return; }
  el.innerHTML = Object.keys(days).sort().reverse().map(k => {
    const [y, m, dd] = k.split("-").map(Number), w = WD[new Date(y, m - 1, dd).getDay()];
    return `<section class="day" aria-label="${m}월 ${dd}일"><div class="when"><b>${m}.${dd}</b><span>${w}요일</span></div><div>` +
      days[k].map(d => `<article class="story"><div class="org">${esc(d.org)}</div><h2>${esc(d.title)}</h2><p>${esc(d.summary)}</p>
        <div class="acts"><a class="src" href="${esc(d.url)}" target="_blank" rel="noopener">원문 보기 ↗</a>${d.video ? `<a class="vid" href="https://www.youtube.com/watch?v=${esc(d.video)}" target="_blank" rel="noopener">영상으로 보기</a>` : ""}</div></article>`).join("") +
      `</div></section>`;
  }).join("");
}
draw();
</script>
</body>
</html>
