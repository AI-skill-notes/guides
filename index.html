}
function draw(){
  const q = norm(st.q);
  const hit = DATA.filter(d => (!q || norm([d.title, d.lead, d.kind, ...d.tools, ...d.keys].join(" ")).includes(q)) && (!st.tool || d.tools.includes(st.tool)) && (!st.kind || d.kind === st.kind));

}

opts("#tool", DATA.flatMap(d => d.tools)); opts("#kind", DATA.map(d => d.kind));
