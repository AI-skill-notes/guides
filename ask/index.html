<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>요청하기 · AI스킬노트</title><meta name="description" content="받고 싶은 자료나 하고 싶은 말을 남겨 주세요">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#F0EEE6;--ink:#141413;--paper:#FAF9F5;--fog:#E8E6DC;--line:#DEDBD0;--coral:#D97757;--coral-d:#B85A3B;--mute:#5E5D59}
*{box-sizing:border-box} html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.7 "IBM Plex Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit} img{display:block;max-width:100%} :focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.nav{position:sticky;top:0;z-index:20;background:rgba(250,249,245,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--fog)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.logo{font:400 22px/1 "Black Han Sans",sans-serif;text-decoration:none;white-space:nowrap}
.logo b{color:var(--coral);font-weight:400}
.nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav li a{display:block;padding:8px 14px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15.5px;white-space:nowrap;color:var(--mute)}
.nav li a:hover{color:var(--ink);background:var(--fog)}
.nav li a[aria-current]{color:var(--ink);font-weight:700;background:var(--sky)}
footer.site{border-top:1px solid var(--fog);color:var(--mute);font-size:14.5px}
footer.site .wrap{padding-top:24px;padding-bottom:36px}
@media (max-width:560px){.nav .wrap{height:56px}.logo{font-size:19px}.nav li a{padding:7px 10px;font-size:14.5px}}
.ask{max-width:680px;padding-top:clamp(36px,6vw,72px);padding-bottom:80px}
.ask h1{font:400 clamp(40px,5.6vw,68px)/1.05 "Black Han Sans",sans-serif;margin:0 0 14px}
.ask .sub{color:var(--mute);font-size:18px;margin:0 0 32px;word-break:keep-all}
form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,32px)}
fieldset{border:0;margin:0 0 24px;padding:0}
legend,label.l{display:block;font-weight:700;margin:0 0 10px}
.kinds{display:flex;flex-wrap:wrap;gap:10px}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds label{border:1px solid var(--line);border-radius:999px;padding:9px 18px;cursor:pointer;font-weight:500;background:var(--paper)}
.kinds input:checked + label{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.kinds input:focus-visible + label{outline:3px solid var(--coral);outline-offset:2px}
textarea,input.t{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",sans-serif;padding:12px 14px}
textarea{min-height:180px;resize:vertical}
textarea:focus,input.t:focus{outline:2px solid var(--coral);border-color:transparent}
.hint{color:var(--mute);font-size:14.5px;margin:6px 0 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.send{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}
button.go{border:0;background:var(--coral);color:#fff;font:700 17px "IBM Plex Sans KR";padding:13px 26px;border-radius:10px;cursor:pointer}
button.go:hover{background:var(--coral-d)} button.go:disabled{opacity:.5;cursor:default}
.msg{font-weight:700} .msg.err{color:#B3261E}
.done{background:var(--sky);border-radius:14px;padding:36px;text-align:center}
.done b{display:block;font-size:22px;margin-bottom:6px}
.done button{margin-top:16px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 16px;font:700 15px "IBM Plex Sans KR";cursor:pointer}
</style></head><body>
<nav class="nav" aria-label="사이트 메뉴"><div class="wrap"><a class="logo" href="/guides/">AI스킬노트<b>.</b></a><ul><li><a href="/guides/">자료실</a></li><li><a href="/guides/news/">Claude 소식</a></li><li><a href="/guides/ask/" aria-current="page">요청하기</a></li><li><a href="https://www.youtube.com/@ai스킬노트" target="_blank" rel="noopener">유튜브</a></li></ul></div></nav>
<main class="wrap ask">
<h1>요청하기</h1>
<p class="sub">받고 싶은 자료나 다뤄 줬으면 하는 주제, 주인장에게 하고 싶은 말을 남겨 주세요. 하나하나 다 읽어요.</p>
<form id="f" novalidate>
  <fieldset><legend>무엇을 남기시나요?</legend>
    <div class="kinds">
      <input type="radio" name="kind" id="k1" value="받고 싶은 자료" checked><label for="k1">받고 싶은 자료</label>
      <input type="radio" name="kind" id="k2" value="다뤄 줬으면 하는 주제"><label for="k2">다뤄 줬으면 하는 주제</label>
      <input type="radio" name="kind" id="k3" value="주인장에게 한마디"><label for="k3">주인장에게 한마디</label>
    </div>
  </fieldset>
  <fieldset><label class="l" for="text">내용</label>
    <textarea id="text" maxlength="3000" placeholder="예: Claude Code로 엑셀 정리하는 법을 자료로 받고 싶어요" required></textarea>
  </fieldset>
  <fieldset><label class="l" for="reply">답장 받을 곳 <span style="font-weight:500;color:var(--mute)">(선택)</span></label>
    <input class="t" id="reply" maxlength="200" placeholder="이메일이나 인스타그램 아이디" autocomplete="email">
    <p class="hint">적어 주시면 답장을 드릴 수 있어요. 답장 말고 다른 데에는 쓰지 않아요.</p>
  </fieldset>
  <div class="hp" aria-hidden="true"><label for="site">비워 두세요</label><input id="site" tabindex="-1" autocomplete="off"></div>
  <div class="send"><button class="go" type="submit">보내기</button><span class="msg" id="msg" role="status"></span></div>
</form>
<div class="done" id="done" hidden><b>잘 받았어요. 고마워요!</b>보내 주신 내용은 주인장이 직접 읽어요.<br><button type="button" id="again">하나 더 보내기</button></div>
</main>
<footer class="site"><div class="wrap">AI스킬노트 · <a href="/guides/">무료 자료실</a></div></footer>
<script>
const f = document.getElementById("f"), msg = document.getElementById("msg");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const text = document.getElementById("text").value.trim();
  if (document.getElementById("site").value) return;          // bots fill the hidden field
  if (text.length < 2) { msg.className = "msg err"; msg.textContent = "내용을 적어 주세요."; document.getElementById("text").focus(); return; }
  const last = +(localStorage.getItem("askAt") || 0);
  if (Date.now() - last < 30000) { msg.className = "msg err"; msg.textContent = "방금 보내셨어요. 30초 뒤에 다시 보내 주세요."; return; }
  const b = f.querySelector("button.go"); b.disabled = true; msg.className = "msg"; msg.textContent = "보내는 중…";
  const body = new URLSearchParams({"entry.382577115": f.kind.value, "entry.759953503": text, "entry.412325409": document.getElementById("reply").value.trim()});
  try {
    await fetch("https://docs.google.com/forms/d/e/1FAIpQLSfN_u6STuMzDGD5de3rDAw2dTV_Eq8cSXgndYlyH3oVyTdARQ/formResponse", {method: "POST", mode: "no-cors", body});
    try { localStorage.setItem("askAt", String(Date.now())); } catch (_) {}
    f.hidden = true; document.getElementById("done").hidden = false; f.reset(); msg.textContent = "";
  } catch (_) { msg.className = "msg err"; msg.textContent = "보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."; }
  b.disabled = false;
});
document.getElementById("again").onclick = () => { document.getElementById("done").hidden = true; f.hidden = false; document.getElementById("text").focus(); };
</script>
</body></html>
